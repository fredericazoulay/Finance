<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Pricer Terminal</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/assets/pricer.svg">
    <link rel="apple-touch-icon" href="/assets/pricer.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b1720">

  <!-- Fallback to backend-provided favicon if the frontend one is not served (helps dev setup) -->
  <script>
    (function() {
      var testImg = new Image();
      testImg.onerror = function() {
        var link = document.querySelector('link[rel~="icon"]');
        if (link) {
          link.href = 'http://localhost:4200/favicon.ico';
        } else {
          var newLink = document.createElement('link');
          newLink.rel = 'icon';
          newLink.type = 'image/x-icon';
          newLink.href = 'http://localhost:4200/favicon.ico';
          document.getElementsByTagName('head')[0].appendChild(newLink);
        }
      };
      testImg.src = '/favicon.ico?cacheBust=' + Date.now();
    })();
  </script>

  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
