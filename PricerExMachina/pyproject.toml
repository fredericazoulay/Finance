[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricer-ex-machina"
version = "0.1.0"
description = "Bond-comparable pricing agent with FastAPI and Streamlit"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "openpyxl>=3.1,<4.0",
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
    "mailpit-api-client>=1.0,<2.0",
    "streamlit>=1.55,<2.0",
    "QuantLib>=1.40,<2.0",
    "scikit-learn>=1.6,<2.0",
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "mistralai>=1.0,<3.0",
]

[tool.setuptools]
packages = ["app"]
