server.port=9092
spring.application.name=finance-pricer
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
pricer.ai.chat-completions-url=${PRICER_AI_CHAT_COMPLETIONS_URL:https://api.openai.com/v1/chat/completions}
pricer.ai.api-key=${PRICER_AI_API_KEY:}
pricer.ai.model=${PRICER_AI_MODEL:gpt-4o-mini}
pricer.bonds.comparables.max-price-age-days=${PRICER_BOND_COMPARABLES_MAX_PRICE_AGE_DAYS:7}
pricer.bonds.market-data.base-url=${PRICER_BOND_MARKET_DATA_BASE_URL:}
pricer.bonds.market-data.search-path=${PRICER_BOND_MARKET_DATA_SEARCH_PATH:/bonds/comparables/search}
pricer.bonds.market-data.source=${PRICER_BOND_MARKET_DATA_SOURCE:Licensed market-data provider}
pricer.bonds.market-data.bearer-token=${PRICER_BOND_MARKET_DATA_BEARER_TOKEN:}
pricer.bonds.market-data.connect-timeout-ms=${PRICER_BOND_MARKET_DATA_CONNECT_TIMEOUT_MS:3000}
pricer.bonds.market-data.read-timeout-ms=${PRICER_BOND_MARKET_DATA_READ_TIMEOUT_MS:10000}
